name: Release My Home
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate version and release configuration
        id: version
        run: |
          node scripts/check-release.mjs
          echo "version=$(node -p 'require("./web/src/inventory/releases.json")[0].version')" >> "$GITHUB_OUTPUT"
      - name: Install web dependencies and run tests
        run: |
          npm ci --prefix web --no-audit --no-fund
          npm test --prefix web
          npm install --global pnpm@11
      - name: Build universal Mac application
        run: INVENTORY_UNIVERSAL=1 bash scripts/build-inventory.sh
      - name: Test native storage
        run: |
          swiftc macos/Sources/HomeInventory/InventoryStore.swift scripts/test-inventory-store.swift -o /tmp/myhome-store-checks
          /tmp/myhome-store-checks
      - name: Package DMG and ZIP
        run: bash scripts/package-inventory.sh
      - name: Sign update feed
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_KEY" || { echo '::error::Configure SPARKLE_EDDSA_PRIVATE_KEY first'; exit 1; }
          mkdir -p build/appcast
          cp build/release/*.zip build/appcast/
          node scripts/release-notes.mjs build/appcast
          printf '%s' "$SPARKLE_KEY" | build/swift/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - --maximum-deltas 0 --embed-release-notes --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ steps.version.outputs.version }}/" build/appcast
          cp build/appcast/appcast.xml build/release/
      - name: Attest public artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            build/release/*.dmg
            build/release/*.zip
      - name: Keep build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MyHome-${{ steps.version.outputs.version }}
          path: build/release/
          if-no-files-found: error
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-notes.mjs
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Life Assistant $VERSION" --notes-file build/release-notes.md build/release/*
